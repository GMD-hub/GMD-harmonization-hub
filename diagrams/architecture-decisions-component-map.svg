<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Architecture Decisions Coverage Map (Draft)</title>
  <desc id="desc">Diagram mapping each ADR to supported system map components while preserving status and authority differences.</desc>
  <defs>
    <style>
      text { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; fill: #1f2933; }
      .node { stroke: #1f2933; stroke-width: 2; }
      .flow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
      .open { stroke: #991b1b; }
      .title { font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 20px; fill: #334155; }
      .label { font-size: 22px; font-weight: 600; }
      .small { font-size: 18px; font-weight: 500; }
      .legend-title { font-size: 22px; font-weight: 700; }
      .legend-item { font-size: 18px; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#ffffff"/>

  <text x="40" y="58" class="title">Architecture Decisions to Component Coverage</text>
  <text x="40" y="88" class="subtitle">Draft map of ADR governance scope over numbered system components.</text>

  <rect class="node" x="40" y="120" rx="16" ry="16" width="460" height="120" fill="#E8F4FF"/>
  <text class="label" x="270" y="168" text-anchor="middle">ADR 0001</text>
  <text class="small" x="270" y="202" text-anchor="middle">Two database architecture</text>

  <rect class="node" x="40" y="280" rx="16" ry="16" width="460" height="120" fill="#E8F4FF"/>
  <text class="label" x="270" y="328" text-anchor="middle">ADR 0002</text>
  <text class="small" x="270" y="362" text-anchor="middle">Atomic mapping only</text>

  <rect class="node" x="40" y="440" rx="16" ry="16" width="460" height="120" fill="#E8F4FF"/>
  <text class="label" x="270" y="488" text-anchor="middle">ADR 0003</text>
  <text class="small" x="270" y="522" text-anchor="middle">Harmonization spec as pivot</text>

  <rect class="node" x="40" y="600" rx="16" ry="16" width="460" height="120" fill="#E8F4FF"/>
  <text class="label" x="270" y="648" text-anchor="middle">ADR 0004</text>
  <text class="small" x="270" y="682" text-anchor="middle">Legacy script ingestion pipeline</text>

  <rect class="node" x="40" y="760" rx="16" ry="16" width="460" height="120" fill="#E8F4FF"/>
  <text class="label" x="270" y="808" text-anchor="middle">ADR 0005</text>
  <text class="small" x="270" y="842" text-anchor="middle">Compound GPID charter scoping</text>

  <rect class="node" x="620" y="140" rx="16" ry="16" width="730" height="90" fill="#E8F7EF"/>
  <text class="label" x="650" y="190">Component 8: Historical decisions DB (advisory)</text>

  <rect class="node" x="620" y="270" rx="16" ry="16" width="730" height="90" fill="#FFF1E3"/>
  <text class="label" x="650" y="320">Component 10 drafting + Component 12 deterministic engine</text>

  <rect class="node" x="620" y="400" rx="16" ry="16" width="730" height="90" fill="#E8F4FF"/>
  <text class="label" x="650" y="450">Component 9: Harmonization specification central artifact</text>

  <rect class="node" x="620" y="530" rx="16" ry="16" width="730" height="90" fill="#E8F4FF"/>
  <text class="label" x="650" y="566">
    <tspan x="650" dy="0">Component 8 ingestion path:</tspan>
    <tspan x="650" dy="24">legacy scripts -&gt; curated precedents</tspan>
  </text>

  <rect class="node open" x="620" y="660" rx="16" ry="16" width="730" height="90" fill="#FFE8E8" stroke-dasharray="2 6"/>
  <text class="label" x="650" y="698" fill="#991b1b">
    <tspan x="650" dy="0">Hub governance scope only</tspan>
    <tspan x="650" dy="24">(not harmonization methodology component)</tspan>
  </text>

  <path class="flow" d="M500 170 L620 185"/>
  <path class="flow" d="M500 340 L620 315"/>
  <path class="flow" d="M500 500 L620 445"/>
  <path class="flow" d="M500 660 L620 575"/>
  <path class="flow dashed" d="M500 820 L620 705"/>

  <rect class="node" x="620" y="790" rx="14" ry="14" width="730" height="150" fill="#ffffff" stroke="#334155"/>
  <text x="650" y="828" class="legend-title">Legend and Status Notes</text>
  <text x="650" y="860" class="legend-item">Solid arrow: direct ADR governance mapping to component</text>
  <text x="650" y="888" class="legend-item">Dashed arrow: contextual governance relation only</text>
  <text x="650" y="916" class="legend-item">
    <tspan x="650" dy="0">Conflict note: ADR 0001 confirms a two-database pattern.</tspan>
    <tspan x="650" dy="24">Canonical infrastructure keeps dedicated vector service as a proposed option.</tspan>
    <tspan x="650" dy="24">Conflict note: ADR 0002 confirms atomic mapping while canonical architecture marks archived atomic-only as proposed.</tspan>
  </text>
</svg>
